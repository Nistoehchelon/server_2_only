[profile.release]
# Maximum optimization level for speed
opt-level = 3

# Full Link Time Optimization (LTO) across all crates
lto = "fat"

# Single codegen unit allows for more global optimizations
codegen-units = 1

# hmm... do I want this?
overflow-checks = true


[workspace]
resolver = "3"
members = ["workspace_crates/*"]

[workspace.dependencies]

# internal workspace crates

server_config = { path = "workspace_crates/server_config" } 
config_reader = { path = "workspace_crates/config_reader" } 
server = { path = "workspace_crates/server" }
http_stuff = { path = "workspace_crates/http_stuff" }
encoding = { path = "workspace_crates/encoding" }
url = { path = "workspace_crates/url" } 
error_structs = { path = "workspace_crates/error_structs" }

# third-party external crates

dotenvy = "0.15.7"
config = "0.15.27"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2.5"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
humantime-serde = "1.1.1"

indexmap = "2.14.2"

tokio = { version = "1.54.1", features = ["full", "tracing"] }
tokio-util = { version = "0.7.20", features = ["full"]}

urlencoding = "2.1.3"




